[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/playback",
    "crates/library",
    "crates/persistence",
    "crates/sources",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
