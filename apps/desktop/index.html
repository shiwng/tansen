<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Both appearances are supported; the root attribute below picks one
         before first paint, so form controls and scrollbars never flash. -->
    <meta name="color-scheme" content="light dark" />
    <title>Tansen</title>
    <script>
      // Theme before first paint: tokens key off data-theme. An explicit
      // Settings override (tansen:appearance, sanitized below) wins over
      // the OS; shell/chrome.ts keeps it synced afterwards.
      (function () {
        var mode = 'system';
        try {
          var stored = JSON.parse(localStorage.getItem('tansen:appearance') || '{}');
          if (stored.theme === 'light' || stored.theme === 'dark') mode = stored.theme;
        } catch (e) {}
        document.documentElement.dataset.theme =
          mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
