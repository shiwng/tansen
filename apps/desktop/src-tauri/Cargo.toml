[package]
name = "tansen"
default-run = "tansen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tansen — a local-first music player"

[features]
# Enabled by `tauri build`: embeds frontendDist instead of pointing at devUrl.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { path = "../../../crates/app-core" }
library = { path = "../../../crates/library" }
persistence = { path = "../../../crates/persistence" }
sources = { path = "../../../crates/sources" }
playback = { path = "../../../crates/playback" }
netguard = { path = "../../../crates/netguard" }
async-trait = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
percent-encoding = "2"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
url = "2"
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
getrandom = "0.2"
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = "0.3"
objc2-media-player = "0.3"
block2 = "0.6"
