# Tansen CI — macOS build + tests.
#
# Mirrors the documented local workflow: sidecar jar from pinned upstream
# (scripts/build-sidecar.sh), then Rust tests, then the frontend.
#
# Windows: intentionally absent. The toolchain (Java 17 + Gradle + sidecar
# resource packaging) has never been exercised on Windows; adding a job that
# has not been verified would claim support that does not exist. See README
# "Known limitations".

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; no job needs a write token.
permissions:
  contents: read
  actions: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out upstream BitChord at the pinned commit (sidecar sibling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kushagrasinghx/BitChord
          # Immutable commit the v1.8.1 tag pointed at when audited; the
          # tag itself is mutable. Keep in sync with BITCHORD_SHA in
          # scripts/build-sidecar.sh.
          ref: 7d956f211b8a46a87184fd3ff87432b51a111dfa
          path: BitChord
          fetch-depth: 1
          # build-sidecar.sh resolves v1.8.1 (the tag the pinned SHA was
          # audited at); a depth-1 checkout ships no tags, so fetch them.
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (Gradle configures the shared module against it)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Ensure platforms;android-37 (AGP pin; symlink where 37.0 ships)
        run: |
          SDK="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -d "$SDK/platforms/android-37" ]; then
            ln -s "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          else
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" >/dev/null || true
          fi

      - name: Build sidecar jar
        env:
          # The script defaults to <repo>/../BitChord for the local sibling
          # layout; this job checks BitChord out inside the workspace.
          BITCHORD_DIR: ${{ github.workspace }}/BitChord
        run: ./scripts/build-sidecar.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Rust formatting check
        run: cargo fmt --all -- --check

      - name: Rust Clippy check
        run: cargo clippy --workspace --all-targets

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust dependency & license audits
        run: |
          command -v cargo-audit >/dev/null || cargo install --locked cargo-audit
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny
          cargo audit
          cargo deny check advisories licenses

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Frontend install + tests + production build + audit
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm audit --audit-level=high
