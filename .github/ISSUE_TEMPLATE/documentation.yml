name: Documentation
description: Report missing, unclear, or outdated documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File or page
      placeholder: "e.g., README.md, docs/architecture.md"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What needs improvement?
      description: Describe what is inaccurate, missing, or confusing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested update (optional)
      description: Proposed wording or section outline, if you have one.
