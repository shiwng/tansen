name: Feature Request
description: Propose a new feature or enhancement for Tansen
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check `docs/feature-matrix.md` first to see if this feature is already planned or intentionally out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve, or what workflow would it improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or design you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Alignment check
      options:
        - label: I checked docs/feature-matrix.md and existing issues to avoid duplicates.
          required: true
