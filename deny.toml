# cargo-deny configuration (F0 S13-resolution stage). Only the advisories
# check is meaningful for this repo's audit workflow; every ignored advisory
# is an informational "unmaintained" warning on a transitive macro/UI-stack
# crate, not a vulnerability (cargo audit reports 0 vulnerabilities).

[advisories]
version = 2
ignore = [
    # paste v1.0.15 ← lofty v0.22 (library metadata tags). Unmaintained
    # upstream; the fix is lofty's migration, not ours.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via lofty, informational only." },
    # proc-macro-error v1.0.4 ← macro stacks of the UI/gtk dependencies.
    # Upstream migrations (proc-macro-error2) land in the dependents.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; transitive, informational only." },
    # glib 0.18.5 ← gtk3 stack (linux-targeted transitive). Unsoundness
    # advisory on an iterator impl not reachable from the shipped macOS
    # paths; fixed by an upstream glib bump.
    { id = "RUSTSEC-2024-0429", reason = "glib VariantStrIter unsoundness; transitive gtk stack, upstream bump required." },
]
