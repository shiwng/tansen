# cargo-deny configuration. Advisories gate the audit workflow; licenses
# validate the accepted dependency set. Every ignored advisory is an
# informational "unmaintained" warning on a transitive macro/UI-stack crate,
# not a vulnerability.

[advisories]
version = 2
ignore = [
    # paste v1.0.15 ← lofty v0.22 (library metadata tags). Unmaintained
    # upstream; the fix is lofty's migration, not ours.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via lofty, informational only." },
    # proc-macro-error v1.0.4 ← macro stacks of the UI/gtk dependencies.
    # Upstream migrations (proc-macro-error2) land in the dependents.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; transitive, informational only." },
]

[licenses]
version = 2
# Explicit allowlist for every license expression in the dependency graph.
# Permissive terms plus the workspace's own GPL-3.0-or-later; MPL-2.0 and
# LGPL-2.1-or-later appear only in transitive crates.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
